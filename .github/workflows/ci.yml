name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: 下载依赖
        run: go mod download

      - name: 检查格式
        run: |
          files="$(find . -name '*.go' -not -path './.git/*' -print | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: 单元测试
        run: go test ./...

      - name: 竞态测试
        run: go test -race ./...

      - name: 静态检查
        run: go vet ./...
